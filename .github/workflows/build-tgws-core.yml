name: Build Telegram core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Rust Android core (16 KB pages)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Set up Android NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned NDK
        shell: bash
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Build and validate ARM libraries
        shell: bash
        env:
          NDK_VERSION: 26.1.10909125
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android21-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$toolchain/armv7a-linux-androideabi21-clang"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android21-clang"
          export CC_armv7_linux_androideabi="$toolchain/armv7a-linux-androideabi21-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export AR_armv7_linux_androideabi="$toolchain/llvm-ar"
          export RANLIB_aarch64_linux_android="$toolchain/llvm-ranlib"
          export RANLIB_armv7_linux_androideabi="$toolchain/llvm-ranlib"
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"

          cargo build --locked --manifest-path third_party/tg-ws-proxy/Cargo.toml \
            --release --target aarch64-linux-android
          cargo build --locked --manifest-path third_party/tg-ws-proxy/Cargo.toml \
            --release --target armv7-linux-androideabi

          mkdir -p dist/arm64-v8a dist/armeabi-v7a
          cp target/aarch64-linux-android/release/libtgwsproxy.so dist/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libtgwsproxy.so dist/armeabi-v7a/

          objdump="$toolchain/llvm-objdump"
          for library in dist/*/libtgwsproxy.so; do
            echo "--- $library ---"
            "$objdump" -p "$library" | awk '$1 == "LOAD" { print $NF }'
            if "$objdump" -p "$library" | awk '$1 == "LOAD" { value=$NF; sub(/^2\\*\\*/, "", value); if (value < 14) bad=1 } END { exit bad }'; then
              :
            else
              echo "Library is not 16 KB aligned: $library" >&2
              exit 1
            fi
          done

      - name: Upload libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tgwsproxy-android-16k-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
