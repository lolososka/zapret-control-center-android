name: Android release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release

    env:
      CI: "true"

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate tag and application version
        id: version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^android-v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag must match android-vX.Y.Z (optionally with a prerelease suffix)."
            exit 1
          fi

          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "::error::Release tag must be annotated, not lightweight."
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#android-v}"
          app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "::error::Tag version '$tag_version' does not match app version '$app_version'."
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::Release tag must point to a commit contained in origin/$DEFAULT_BRANCH."
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Install native and Android build tools
        shell: bash
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Verify and build release APK
        shell: bash
        run: bash ./gradlew --no-daemon --stacktrace lintRelease testReleaseUnitTest assembleRelease

      # Restore the signing key only after all repository-controlled build code
      # has finished. This prevents Gradle/native tasks from reading the key.
      - name: Require signing secrets and restore keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required signing secret for $variable is missing."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"
          if [[ ! -s "$RUNNER_TEMP/android-release.keystore" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

      - name: Align, sign and verify APK
        id: artifact
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release APK, found ${#candidates[@]}."
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/34.0.0"
          output_dir="$RUNNER_TEMP/release-assets"
          apk_name="zapret-mobile-${RELEASE_VERSION}.apk"
          aligned_apk="$RUNNER_TEMP/aligned-unsigned.apk"
          signed_apk="$output_dir/$apk_name"
          mkdir -p "$output_dir"

          "$build_tools/zipalign" -f -p 4 "${candidates[0]}" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/android-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          "$build_tools/zipalign" -c -P 16 -v 4 "$signed_apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$signed_apk"

          (
            cd "$output_dir"
            sha256sum "$apk_name" > "$apk_name.sha256"
          )

          echo "apk=$signed_apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$signed_apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Bundle corresponding source
        id: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          source_name="zapret-mobile-${RELEASE_VERSION}-source"
          source_root="$RUNNER_TEMP/$source_name"
          source_archive="$RUNNER_TEMP/release-assets/$source_name.tar.gz"
          mkdir -p "$source_root"

          rsync -a \
            --exclude='.git' \
            --exclude='.gradle/' \
            --exclude='.cxx/' \
            --exclude='build/' \
            --exclude='jniLibs/' \
            --exclude='local.properties' \
            ./ "$source_root/"
          git submodule status --recursive > "$source_root/SUBMODULE_REVISIONS.txt"

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar \
            --sort=name \
            --mtime="@$source_date_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$source_archive" \
            -C "$RUNNER_TEMP" \
            "$source_name"
          (
            cd "$(dirname "$source_archive")"
            sha256sum "$(basename "$source_archive")" > "$(basename "$source_archive").sha256"
          )

          echo "archive=$source_archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$source_archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload signed release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zapret-mobile-${{ steps.version.outputs.version }}-signed
          path: |
            ${{ steps.artifact.outputs.apk }}
            ${{ steps.artifact.outputs.checksum }}
            ${{ steps.source.outputs.archive }}
            ${{ steps.source.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.artifact.outputs.apk }}
          CHECKSUM_PATH: ${{ steps.artifact.outputs.checksum }}
          SOURCE_PATH: ${{ steps.source.outputs.archive }}
          SOURCE_CHECKSUM_PATH: ${{ steps.source.outputs.checksum }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for this tag already exists. Remove or inspect it manually before retrying."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$APK_PATH" \
            "$CHECKSUM_PATH" \
            "$SOURCE_PATH" \
            "$SOURCE_CHECKSUM_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Zapret Mobile $RELEASE_VERSION"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/android-release.keystore" ]]; then
            shred -u "$RUNNER_TEMP/android-release.keystore" || rm -f "$RUNNER_TEMP/android-release.keystore"
          fi
